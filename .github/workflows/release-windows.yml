# Windows package.
#   - every push to main and every pull request: build + smoke test, upload a
#     downloadable artifact to the workflow run
#   - pushing a tag like v1.0.0: same, plus the zip is attached to the
#     GitHub Release for that tag (created automatically)
#   - "Run workflow" button: manual build on demand
name: Package · Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/build-package.yml
    with:
      runner: windows-latest
      label: windows-x64
