# Reusable build job shared by the per-OS release workflows
# (release-linux.yml, release-macos.yml, release-windows.yml).
#
# What it does on the requested runner:
#   1. install Python + requirements + PyInstaller
#   2. build dist/CAIN-Keeper/ from cain_keeper.spec
#   3. run scripts/smoke_test.py against the built executable
#   4. zip it up (with README + LICENSE) and upload it as a workflow artifact
#   5. on a v* tag, attach the zip to the GitHub Release for that tag
#      (creating it, with generated notes, only if it doesn't exist yet)
name: Build package

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label (ubuntu-latest, windows-latest, macos-latest, ...)
        required: true
        type: string
      label:
        description: Platform suffix for the zip name (linux-x64, windows-x64, macos-arm64, ...)
        required: true
        type: string
      release_notes:
        description: >-
          Let this job generate release notes if the tag has no release yet.
          Only ONE of the per-OS workflows should pass true, otherwise each job
          appends its own copy of the notes to the shared release.
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write   # needed to attach assets to the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # Computed before the build so it can be baked into the VERSION file
      # PyInstaller bundles (see cain_keeper.spec, updater.py): a packaged
      # build's in-app update check reads this back to know its own
      # version, so it must reflect the actual tag being built, not
      # whatever the committed placeholder file says.
      - name: Work out the version
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF#refs/tags/}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          echo "$VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=CAIN-Keeper-${VERSION}-${{ inputs.label }}.zip" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean cain_keeper.spec

      - name: Smoke test the executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/CAIN-Keeper/CAIN-Keeper.exe; else EXE=dist/CAIN-Keeper/CAIN-Keeper; fi
          python scripts/smoke_test.py "$EXE"

      - name: Package
        shell: bash
        run: |
          cp README.md LICENSE dist/CAIN-Keeper/
          cd dist
          case "$RUNNER_OS" in
            Windows) 7z a -tzip "../${{ steps.meta.outputs.zip }}" CAIN-Keeper ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent CAIN-Keeper "../${{ steps.meta.outputs.zip }}" ;;
            *)       zip -qr "../${{ steps.meta.outputs.zip }}" CAIN-Keeper ;;
          esac
          ls -la "../${{ steps.meta.outputs.zip }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip }}
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      # Create the release if this job is the first to reach it (only the
      # designated job generates notes - see release_notes above - so two
      # parallel OS jobs racing here don't each write their own copy; a
      # release made on the GitHub website keeps its own notes either way),
      # then upload this platform's zip via the gh CLI directly rather than
      # a third-party action, wrapped in a retry loop: uploads in this size
      # range (15-35 MB) occasionally hit a transient "Headers Timeout
      # Error" against the Releases API with no code-level cause - that's
      # what left v1.0.2's Linux asset missing after everything up to this
      # point (build, smoke test, artifact upload) had already succeeded.
      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ inputs.release_notes }}" = "true" ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes || true
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "" || true
            fi
          fi
          for attempt in 1 2 3 4; do
            if gh release upload "$TAG" "${{ steps.meta.outputs.zip }}" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Uploaded ${{ steps.meta.outputs.zip }} on attempt $attempt"
              exit 0
            fi
            echo "::warning::Upload attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "::error::Failed to upload ${{ steps.meta.outputs.zip }} to release $TAG after 4 attempts"
          exit 1
