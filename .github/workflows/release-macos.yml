# macOS package.
#   - every push to main and every pull request: build + smoke test, upload a
#     downloadable artifact to the workflow run
#   - pushing a tag like v1.0.0: same, plus the zip is attached to the
#     GitHub Release for that tag (created automatically)
#   - "Run workflow" button: manual build on demand
name: Package · macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    uses: ./.github/workflows/build-package.yml
    with:
      runner: macos-latest   # Apple Silicon. For an Intel build add a second job with an x86_64 runner label and label: macos-x64.
      label: macos-arm64
