# macOS package (Gitea Actions version, runs on the self-hosted Apple Silicon Mac runner).
#   - every push to main and every pull request: build + smoke test
#   - pushing a tag like v1.0.0: same, plus the zip and .dmg are attached to the
#     Gitea Release for that tag (created automatically if it doesn't exist)
#   - "Run workflow" button: manual build on demand
#
# Flattened from build-package.yml + release-macos.yml. Differences from GitHub:
#   - runs-on uses the runner label "macos" (host mode, no Docker)
#   - uses a venv from the python.org Python 3.12 (universal2, runs arm64) instead
#     of actions/setup-python, and fails early if that Python isn't arm64
#   - no upload-artifact (v4 isn't supported on Gitea); files go on the Release
#   - releases are created/uploaded through Gitea's API with curl, not gh
#   - label is macos-arm64 (Apple Silicon). The runner binary and python3 must be
#     native arm64, not x86_64 running under Rosetta, or builds come out Intel
name: Package · macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macos-arm64
    runs-on: macos
    env:
      LABEL: macos-arm64
      # Explicit path on purpose: the runner's PATH can pick up an x86_64 conda
      # python3, which would silently produce an Intel build.
      PYTHON: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF#refs/tags/}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          echo "$VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=CAIN-Keeper-${VERSION}-${LABEL}.zip" >> "$GITHUB_OUTPUT"
          echo "installer=CAIN-Keeper-${VERSION}-${LABEL}.dmg" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          "$PYTHON" --version
          "$PYTHON" -c "import platform,sys; print('machine:', platform.machine()); sys.exit(0 if platform.machine()=='arm64' else 'ERROR: Python is not native arm64 (got '+platform.machine()+')')"
          rm -rf .venv dist build
          "$PYTHON" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller --noconfirm --clean cain_keeper.spec

      - name: Smoke test the executable
        run: .venv/bin/python scripts/smoke_test.py dist/CAIN-Keeper/CAIN-Keeper

      - name: Package zip
        run: |
          cp README.md LICENSE dist/CAIN-Keeper/
          cd dist
          ditto -c -k --sequesterRsrc --keepParent CAIN-Keeper "../${{ steps.meta.outputs.zip }}"
          ls -la "../${{ steps.meta.outputs.zip }}"

      - name: Build .dmg
        run: |
          mkdir -p dist/dmg-src
          cp -R "dist/CAIN Keeper.app" dist/dmg-src/
          ln -s /Applications dist/dmg-src/Applications
          hdiutil create -volname "CAIN Keeper" -srcfolder dist/dmg-src -ov -format UDZO \
            "dist/${{ steps.meta.outputs.installer }}"
          ls -la "dist/${{ steps.meta.outputs.installer }}"
          test -s "dist/${{ steps.meta.outputs.installer }}"

      - name: Publish to the Gitea Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          AUTH="Authorization: token $TOKEN"

          json_get() { python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('$1',''))"; }

          # find the release for this tag, or create it
          ID=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" | json_get id)
          if [ -z "$ID" ]; then
            ID=$(curl -s -f -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"\"}" \
              "$API/releases" | json_get id)
          fi
          echo "Release id: $ID"
          [ -n "$ID" ]

          upload_with_retry() {
            local file="$1" name
            name=$(basename "$file")
            # replace an existing asset with the same name (like --clobber)
            OLD=$(curl -s -H "$AUTH" "$API/releases/$ID/assets" | python3 -c "
          import sys,json
          for a in json.load(sys.stdin):
              if a['name']=='$name': print(a['id'])")
            for o in $OLD; do curl -s -X DELETE -H "$AUTH" "$API/releases/$ID/assets/$o"; done
            for attempt in 1 2 3 4; do
              if curl -s -f -X POST -H "$AUTH" -F "attachment=@$file" "$API/releases/$ID/assets?name=$name" >/dev/null; then
                echo "Uploaded $name on attempt $attempt"
                return 0
              fi
              echo "Upload attempt $attempt for $name failed, retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            done
            echo "Failed to upload $name after 4 attempts"
            return 1
          }

          upload_with_retry "${{ steps.meta.outputs.zip }}"
          upload_with_retry "dist/${{ steps.meta.outputs.installer }}"
